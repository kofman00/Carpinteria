<title>Encaja 360</title><link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🪵</text></svg>">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark;--gold:#ffc94a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;touch-action:none}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none}body{position:fixed;left:0;top:0;right:0;bottom:0;width:100%;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);-webkit-touch-callout:none;-webkit-text-size-adjust:100%}
body{background:radial-gradient(ellipse at 50% 0,#6b4121,#2b170c 70%) #2b170c;color:#fff3dc;font-family:"Trebuchet MS",system-ui,sans-serif;display:flex;justify-content:center}
#app{width:100%;max-width:480px;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:6px 14px}#app>*+*{margin-top:10px}
#hd{width:var(--bs);display:flex;justify-content:space-between;align-items:center}
#logo{max-width:calc(100% - 58px);max-height:62px;width:auto;height:auto}
.bt{width:46px;height:46px;border-radius:12px;border:2px solid #8a5a34;background:linear-gradient(#5b3a22,#3b2414);color:#ffe2b0;font-size:18px;font-weight:900;box-shadow:0 3px 0 #1a0d05;display:grid;place-items:center;cursor:pointer}
.bt:active{transform:translateY(2px);box-shadow:0 1px 0 #1a0d05}
#st{width:var(--bs);display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.pl{background:linear-gradient(#5b3a22,#3b2414);border:1px solid #7a5232;border-radius:10px;padding:5px 4px;text-align:center;box-shadow:0 3px 6px #0008,inset 0 1px 0 #ffffff22}
.pl small{display:block;font-size:11px;font-weight:800;letter-spacing:.5px;color:#f2d9b0}
.pl b{font-size:21px;color:#fff3dc;display:inline-block}.pl.g b{color:var(--gold)}
.bump{animation:bp .3s}@keyframes bp{50%{transform:scale(1.3);color:var(--gold)}}
#frame{width:var(--bs);border-radius:16px;border:6px solid #b0733f;background:#1d0f07;padding:5px;box-shadow:0 8px 20px #000a,inset 0 0 12px #000}
#board{display:grid;grid-template-columns:repeat(8,1fr);gap:2px;grid-template-rows:repeat(8,1fr);height:calc(var(--bs) - 22px)}
.c{border-radius:5px}
#board .c:not(.f){background:#2c1a0e;box-shadow:inset 0 2px 4px #000a}
.f{background-image:linear-gradient(145deg,#fff3,#0002),repeating-linear-gradient(95deg,#0000 0 6px,#0000001a 6px 7px,#0000 7px 11px,#ffffff14 11px 12px);box-shadow:inset 1px 1px 0 #fff6,inset -2px -3px 0 #0003,0 1px 2px #0006}
.t1{background-color:#e9bd80}.t2{background-color:#d19553}.t3{background-color:#a14e2b}.t4{background-color:#c28147}

<script>
const $=id=>document.getElementById(id),SH="1,11,111,1111,11/11,111/111/111,111/111,11/10,111/010,110/011,011/110,10/10/11,100/100/111,1111/1000".split(",").map(s=>s.split("/").map(r=>[...r].map(Number)));
const board=$("board"),tray=$("tray"),cells=[],slots=[],cv=$("fxc"),cx=cv.getContext("2d");
let b,pieces,score,combo,best=0,rec0=0,over=false,paused=false,drag=null,AC,mute=false,parts=[];
try{best=+localStorage.getItem("e360best")||0;mute=localStorage.getItem("e360mute")=="1"}catch(e){}
for(let i=0;i<64;i++){const d=document.createElement("div");d.className="c";board.appendChild(d);cells.push(d)}
const rot=m=>m[0].map((_,c)=>m.map(r=>r[c]).reverse()),rnd=n=>Math.floor(Math.random()*n);
const can=(m,r,c,bb=b)=>m.every((row,i)=>row.every((v,j)=>!v||(r+i>=0&&r+i<8&&c+j>=0&&c+j<8&&!bb[(r+i)*8+c+j])));
function fits(m){for(let k=0;k<4;k++){for(let r=0;r<8;r++)for(let c=0;c<8;c++)if(can(m,r,c))return true;m=rot(m)}return false}
function full(t){const s=new Set;let n=0;for(let i=0;i<8;i++){if([...Array(8)].every((_,j)=>t[i*8+j])){n++;for(let j=0;j<8;j++)s.add(i*8+j)}if([...Array(8)].every((_,j)=>t[j*8+i])){n++;for(let j=0;j<8;j++)s.add(j*8+i)}}return{s,n}}
function newSet(){let p;for(let t=0;t<40;t++){p=[0,1,2].map(()=>({m:SH[rnd(SH.length)],t:1+rnd(4)}));if(p.some(x=>fits(x.m)))break}return p}
function fit(){const bs=Math.max(240,Math.min(innerWidth-28,innerHeight-310,440));document.documentElement.style.setProperty("--bs",bs+"px");document.documentElement.style.setProperty("--tc",Math.floor(bs*.06)+"px");cv.width=innerWidth;cv.height=innerHeight;drawTray()}
function mk(m,cs,t,cl){const d=document.createElement("div");d.className=cl;d.style.gridTemplateColumns=`repeat(${m[0].length},${cs}px)`;d.style.gridAutoRows=cs+"px";m.forEach(r=>r.forEach(v=>{const e=document.createElement("div");if(v)e.className="c f t"+t;d.appendChild(e)}));return d}
function drawTray(){if(!pieces)return;tray.innerHTML="";slots.length=0;const cs=Math.floor(parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--bs"))*.06);pieces.forEach((p,i)=>{const s=document.createElement("div");s.className="sl";if(p)s.appendChild(mk(p.m,cs,p.t,"pc"));s.onpointerdown=e=>down(e,i);s.ontouchstart=e=>{if(!window.PointerEvent&&e.touches[0])down(e.touches[0],i)};tray.appendChild(s);slots.push(s)})}
function render(g){let tb=b,gh=new Set,w=new Set;if(g){tb=b.slice();g.m.forEach((row,i)=>row.forEach((v,j)=>{if(v){const k=(g.r+i)*8+g.c+j;tb[k]=g.t;gh.add(k)}}));full(tb).s.forEach(k=>w.add(k))}
cells.forEach((e,k)=>e.className="c"+(tb[k]?" f t"+tb[k]:"")+(gh.has(k)?" gh":"")+(w.has(k)?" wl":""))}
function hud(bump){$("sc").textContent=score.toLocaleString("es");$("cb").textContent="x"+(combo?1+(combo-1)*.5:1);$("bs2").textContent=Math.max(best,score).toLocaleString("es");if(bump){const e=$("sc");e.classList.remove("bump");void e.offsetWidth;e.classList.add("bump")}}
function save(){try{localStorage.setItem("e360",JSON.stringify({b,pieces,score,combo}))}catch(e){}}
function start(r){over=false;paused=false;$("ov").className="";rec0=best;let s=null;try{if(r)s=JSON.parse(localStorage.getItem("e360"))}catch(e){}

render();drawTray();hud();save()}
// audio
function au(){if(!AC)try{AC=new(window.AudioContext||window.webkitAudioContext)}catch(e){}if(AC&&AC.state!="running"){try{AC.resume()}catch(e){}if(!au.k){au.k=1;try{const s=AC.createBufferSource();s.buffer=AC.createBuffer(1,1,22050);s.connect(AC.destination);s.start(0)}catch(e){}}}}
function tone(a,z,d,v,ty="sine",t=0){if(mute||!AC)return;const o=AC.createOscillator(),g=AC.createGain(),n=AC.currentTime+t;o.type=ty;o.frequency.setValueAtTime(a,n);o.frequency.exponentialRampToValueAtTime(z,n+d);g.gain.setValueAtTime(v,n);g.gain.exponentialRampToValueAtTime(.001,n+d);o.connect(g).connect(AC.destination);o.start(n);o.stop(n+d)}
function nz(d,f,v,t=0){if(mute||!AC)return;const l=AC.sampleRate*d,bf=AC.createBuffer(1,l,AC.sampleRate),x=bf.getChannelData(0);for(let i=0;i<l;i++)x[i]=(Math.random()*2-1)*(1-i/l);const s=AC.createBufferSource(),fl=AC.createBiquadFilter(),g=AC.createGain();s.buffer=bf;fl.type="bandpass";fl.frequency.value=f;g.gain.value=v;s.connect(fl).connect(g).connect(AC.destination);s.start(AC.currentTime+t)}

const f=drag.fl,w=f.offsetWidth,h=f.offsetHeight,L=e.clientX-w/2,T=e.clientY-h-46;f.style.left=L+"px";f.style.top=T+"px";
const a=cells[0].getBoundingClientRect(),pitch=cells[1].getBoundingClientRect().left-a.left,r=Math.round((T-a.top)/pitch),c=Math.round((L-a.left)/pitch),ok=can(p.m,r,c);drag.t={r,c,ok};render(ok?{m:p.m,r,c,t:p.t}:null)};addEventListener("pointermove",mv);
const up=e=>{if(!drag)return;const d=drag;drag=null;if(!d.fl){const p=pieces[d.i];p.m=rot(p.m);drawTray();au();tone(500,350,.06,.2,"triangle");return}
